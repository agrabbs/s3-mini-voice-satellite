substitutions:
  name: s3-mini-voice-satellite
  friendly_name: S3 Mini Voice Satellite
  
  # Pin Assignments
  # I2S Microphone (INMP441)
  mic_i2s_sck: GPIO7
  mic_i2s_ws: GPIO8
  mic_i2s_sd: GPIO9
  
  # I2S Speaker (MAX98357A)
  speaker_i2s_bclk: GPIO4
  speaker_i2s_lrc: GPIO5
  speaker_i2s_din: GPIO6
  
  # Status LED (Built-in RGB LED)
  led_pin: GPIO47

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "home-assistant.voice-satellite"
    version: "1.0.0"
  min_version: 2024.11.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # Optimize audio performance
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      # Audio buffering
      CONFIG_AUDIO_BOARD_CUSTOM: "y"

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# Web server for diagnostics (optional, can be disabled to save memory)
web_server:
  port: 80
  local: true

# Status LED - Built-in RGB LED on GPIO47
light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: ${led_pin}
    num_leds: 1
    chipset: ws2812
    name: "Status LED"
    id: status_led
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    effects:
      # Listening - Blue breathing
      - pulse:
          name: "Listening Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 20%
          max_brightness: 80%
      # Processing - Cyan spinner
      - pulse:
          name: "Processing Pulse"
          transition_length: 0.3s
          update_interval: 0.3s
          min_brightness: 50%
          max_brightness: 100%
      # Speaking - Green pulse
      - pulse:
          name: "Speaking Pulse"
          transition_length: 0.4s
          update_interval: 0.4s
          min_brightness: 40%
          max_brightness: 90%
      # Wake word detected - Fast blue flash
      - strobe:
          name: "Wake Word Flash"
          colors:
            - state: true
              brightness: 100%
              red: 0%
              green: 0%
              blue: 100%
              duration: 150ms
            - state: false
              duration: 150ms
      # Error - Red flash
      - strobe:
          name: "Error Flash"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 300ms
            - state: false
              duration: 300ms
      # Success - Green flash
      - strobe:
          name: "Success Flash"
          colors:
            - state: true
              brightness: 100%
              red: 0%
              green: 100%
              blue: 0%
              duration: 200ms
            - state: false
              duration: 200ms

# I2S Audio Configuration
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: ${speaker_i2s_lrc}
    i2s_bclk_pin: ${speaker_i2s_bclk}

# Microphone Configuration (INMP441)
microphone:
  - platform: i2s_audio
    id: external_mic
    adc_type: external
    i2s_din_pin: ${mic_i2s_sd}
    pdm: false
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit

# Speaker Configuration (MAX98357A)
speaker:
  - platform: i2s_audio
    id: external_speaker
    dac_type: external
    i2s_dout_pin: ${speaker_i2s_din}
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit
    timeout: 2s

# Media Player Configuration (for announcements and media playback)
media_player:
  - platform: speaker
    name: "Media Player"
    id: media_player_component
    buffer_size: 20000
    announcement_pipeline:
      speaker: external_speaker
      format: WAV
      sample_rate: 16000
      num_channels: 1
    on_announcement:
      - if:
          condition:
            switch.is_on: announcement_chime
          then:
            - logger.log: "Playing announcement with chime"
      - light.turn_on:
          id: status_led
          red: 100%
          green: 50%
          blue: 0%
          brightness: 70%
          effect: "Speaking Pulse"
    on_play:
      - light.turn_on:
          id: status_led
          red: 0%
          green: 100%
          blue: 50%
          brightness: 60%
    on_idle:
      - light.turn_off: status_led

# Micro Wake Word Component - DISABLED to save RAM for announcements
# micro_wake_word:
#   models:
#     - model: hey_jarvis
#   on_wake_word_detected:
#     - voice_assistant.start:
#         wake_word: !lambda return wake_word;

# Voice Assistant Configuration
voice_assistant:
  id: va
  microphone: external_mic
  media_player: media_player_component
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 0.3
  
  on_client_connected:
    - light.turn_on:
        id: status_led
        red: 0%
        green: 100%
        blue: 0%
        brightness: 50%
        effect: "Success Flash"
    - delay: 2s
    - light.turn_off: status_led
  
  on_client_disconnected:
    - light.turn_on:
        id: status_led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 50%
  
  on_listening:
    - light.turn_on:
        id: status_led
        red: 0%
        green: 0%
        blue: 100%
        brightness: 60%
        effect: "Listening Pulse"
  
  on_stt_vad_start:
    - light.turn_on:
        id: status_led
        red: 0%
        green: 50%
        blue: 100%
        brightness: 70%
        effect: "Processing Pulse"
  
  on_stt_vad_end:
    - light.turn_on:
        id: status_led
        red: 0%
        green: 100%
        blue: 100%
        brightness: 60%
  
  on_end:
    - delay: 100ms
    - light.turn_off: status_led
  
  on_error:
    - light.turn_on:
        id: status_led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 80%
        effect: "Error Flash"
    - delay: 3s
    - light.turn_off: status_led

# Control switches
switch:
  # - platform: template
  #   name: "Use Wake Word"
  #   id: use_wake_word
  #   optimistic: true
  #   restore_mode: RESTORE_DEFAULT_ON
  #   entity_category: config
  #   on_turn_on:
  #     - if:
  #         condition:
  #           lambda: return id(va).is_running();
  #         then:
  #           - voice_assistant.stop:
  #     - micro_wake_word.start:
  #   on_turn_off:
  #     - voice_assistant.stop:
  #     - micro_wake_word.stop:

  - platform: template
    name: "Announcement Chime"
    id: announcement_chime
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    icon: mdi:bell-ring

  - platform: restart
    name: "Restart"
    entity_category: diagnostic

# Diagnostic sensors
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

button:
  - platform: template
    name: "Start Voice Assistant"
    id: start_va
    on_press:
      - voice_assistant.start:

  - platform: template
    name: "Stop Voice Assistant"
    id: stop_va
    on_press:
      - voice_assistant.stop:
